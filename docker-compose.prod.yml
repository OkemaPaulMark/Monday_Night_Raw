# Explicit project name so this file's volumes/network never collide with
# docker-compose.yml's (Compose otherwise derives the project name from the
# directory, so both files would resolve to the *same* volumes if ever run
# on the same host — silently inheriting dev seed data into what's meant to
# be a clean production database).
name: mnraw-prod

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      SQLITE_DB_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    # seed_data creates the admin from SEED_ADMIN_USERNAME/SEED_ADMIN_PASSWORD
    # in .env — set those to real values, not the dev defaults, before
    # deploying. It's a no-op on restart if the admin already exists.
    #
    # A single gunicorn worker process (with multiple threads) rather than
    # several: SQLite allows one writer at a time, and keeping all requests
    # in one process avoids cross-process write-lock contention on the
    # database file. WAL mode (config/settings.py) lets reads still proceed
    # concurrently with that writer.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 60 --max-requests 500 --max-requests-jitter 50"
    mem_limit: 350m
    mem_reservation: 150m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
      - static_data:/usr/share/nginx/static:ro
    depends_on:
      - backend
    mem_limit: 64m
    mem_reservation: 32m

volumes:
  sqlite_data:
  media_data:
  static_data:
