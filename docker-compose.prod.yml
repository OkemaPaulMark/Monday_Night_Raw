# Explicit project name so this file's volumes/network never collide with
# docker-compose.yml's (Compose otherwise derives the project name from the
# directory, so both files would resolve to the *same* postgres_data volume
# if ever run on the same host — silently inheriting dev seed data/passwords
# into what's meant to be a clean production database).
name: mnraw-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monday_night_raw}
      POSTGRES_USER: ${POSTGRES_USER:-mnraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a real POSTGRES_PASSWORD in .env for production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Trimmed from Postgres defaults (128MB shared_buffers, 100 connections)
    # for a small single-box deploy — this app has ~14 users, not thousands.
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnraw} -d ${POSTGRES_DB:-monday_night_raw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 200m
    mem_reservation: 128m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "False"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    # seed_data creates the admin from SEED_ADMIN_USERNAME/SEED_ADMIN_PASSWORD
    # in .env — set those to real values, not the dev defaults, before
    # deploying. It's a no-op on restart if the admin already exists.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --max-requests 500 --max-requests-jitter 50"
    mem_limit: 400m
    mem_reservation: 200m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
      - static_data:/usr/share/nginx/static:ro
    depends_on:
      - backend
    mem_limit: 64m
    mem_reservation: 32m

volumes:
  postgres_data:
  media_data:
  static_data:
